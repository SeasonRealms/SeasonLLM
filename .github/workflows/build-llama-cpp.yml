name: build-llama-cpp.yml

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "CMake build type"
        required: true
        type: choice
        default: "Release"
        options:
          - Release
          - Debug
      llama_ref:
        description: "SeasonRealms/llama.cpp tag / branch / commit"
        required: true
        default: "master"
      ggml_ref:
        description: "SeasonRealms/ggml tag / branch / commit (must resolve to the ref the other packages build)"
        required: true
        # The product ships ONE ggml: every package - SeasonGGML, this one,
        # stable-diffusion, qwentts and SeasonThreeD - compiles SeasonRealms/ggml's
        # master and ships the ggml*.dll it produced, so whichever package a module is
        # taken from, it is the same module. master carries the fastdiv fix and the
        # GGML_PREC_F32 FlashAttention patches the whole product relies on, and a ref
        # skew here is a silent behaviour difference at run time. Deliberately not a
        # tag: the commit this run resolved is recorded in the artifact manifest.
        default: "master"
      cuda_version:
        description: "CUDA Toolkit version for the Windows and Linux builds, aligned with SeasonTTS"
        required: false
        default: "12.8.1"
      cuda_architectures:
        description: "CUDA architectures for the Windows and Linux CUDA builds"
        required: false
        default: "75-virtual;80-real;86-real;89-real;90-virtual"
      maccatalyst_min_ios:
        description: "Mac Catalyst deployment target (iOS version used in the *-macabi triple)"
        required: false
        default: "15.0"
      maccatalyst_blas:
        description: "Build the Accelerate-backed BLAS backend for Mac Catalyst"
        required: false
        type: choice
        default: "ON"
        options:
          - ON
          - OFF
      ios_deployment_target:
        description: "iOS deployment target for the device and simulator builds (forms the arm64-apple-ios<ver> triples)"
        required: false
        default: "17.0"
      ios_blas:
        description: "Build the Accelerate-backed BLAS backend for iOS"
        required: false
        type: choice
        default: "ON"
        options:
          - ON
          - OFF
      android_ndk_version:
        description: "Android NDK version for the android build (r28+ required: 16 KB page-size support)"
        required: false
        default: "28.2.13676358"
      build_target:
        description: "Platform to build (one job per run)"
        required: true
        type: choice
        default: "maccatalyst"
        options:
          - maccatalyst
          - ios
          - windows
          - linux
          - android
      build_parallel:
        description: "Parallel build jobs"
        required: false
        default: "4"

permissions:
  contents: read

env:
  LLAMA_REPO: SeasonRealms/llama.cpp
  GGML_REPO: SeasonRealms/ggml

jobs:
  build-windows:
    # Runs only when build_target is windows; every other build job is gated the same
    # way, so exactly one build job executes per workflow run.
    if: github.event.inputs.build_target == 'windows'
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout SeasonRealms/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_REPO }}
          ref: ${{ github.event.inputs.llama_ref }}
          submodules: false

      - name: Replace ggml with SeasonRealms fork
        shell: pwsh
        run: |
          if (Test-Path ggml) {
            Remove-Item ggml -Recurse -Force
          }

          git clone "https://github.com/${{ env.GGML_REPO }}.git" ggml
          git -C ggml fetch --depth 1 origin "${{ github.event.inputs.ggml_ref }}"
          git -C ggml checkout FETCH_HEAD
          git -C ggml rev-parse HEAD

      # ggml's backend entry points are not in ggml.dll: with GGML_BACKEND_DL=ON
      # ggml-cpu / ggml-cuda / ggml-vulkan are MODULE libraries that ggml only
      # add_dependencies() on, so there is no import library and
      # ggml_backend_cpu_init() & co. cannot be linked. llama.cpp reaches the CPU
      # backend through ggml_backend_reg_get_proc_address() (common/common.cpp,
      # src/llama-context.cpp, src/llama.cpp), which is what this step keeps true -
      # a direct call would surface as C3861 immediately or as LNK2019 at the end of
      # a CUDA build, and the two tools that do link backends directly
      # (cvector-generator, export-lora) are gated on NOT GGML_BACKEND_DL by
      # llama.cpp's own tools/CMakeLists.txt.
      #
      # The symbol set is read out of ggml's own headers rather than listed here, so
      # a ggml bump that adds an entry point extends the guard automatically. Legal
      # shapes are filtered out rather than reported: a symbol named only as a
      # string for get_proc_address(), a symbol named only inside decltype() to
      # recover its signature, and comments. Skipped paths are the ones this lane
      # does not compile (tests, pocs, examples, docs - LLAMA_BUILD_TESTS/EXAMPLES
      # are OFF below) plus those two gated tools.
      - name: Check sources stay on the backend registry API
        shell: pwsh
        run: |
          $src     = '.'
          $ggmlInc = 'ggml/include'
          $exempt  = @()
          $skip    = @('ggml', 'docs', 'pocs', 'examples', 'tests', 'tools/cvector-generator', 'tools/export-lora')

          # Entry point = the identifier right before '(' on a GGML_BACKEND_API line.
          $syms = foreach ($h in 'ggml-cpu.h', 'ggml-cuda.h', 'ggml-vulkan.h', 'ggml-metal.h') {
            foreach ($line in Get-Content -LiteralPath (Join-Path $ggmlInc $h) -ErrorAction SilentlyContinue) {
              if ($line -match 'GGML_BACKEND_API\s+.*?([A-Za-z_]\w*)\s*\(') { $matches[1] }
            }
          }
          $syms = @($syms | Sort-Object -Unique | Where-Object { $exempt -notcontains $_ })
          # Fail closed: a silently empty set would leave this step green forever.
          if ($syms.Count -lt 60) {
            throw "read only $($syms.Count) backend entry points from $ggmlInc - ggml's headers changed shape and the guard cannot be trusted"
          }

          $word     = '(?<![A-Za-z0-9_])(?:' + ($syms -join '|') + ')(?![A-Za-z0-9_])'
          $pathspec = @('.') + ($skip | ForEach-Object { ":(exclude)$_" })
          $raw      = git -C $src grep --untracked -n -I -w -E ($syms -join '|') -- @pathspec
          if ($LASTEXITCODE -gt 1) { throw "git grep failed with $LASTEXITCODE" }

          $bad = foreach ($hit in $raw) {
            $file, $line, $text = $hit -split ':', 3
            if ($text -match 'get_proc_address|decltype') { continue }
            $code = $text -replace '"[^"]*"', '""' -replace '//.*$', '' -replace '/\*[^*]*\*/', ''
            if ($code -notmatch $word) { continue }
            "${file}:${line}: $($code.Trim())"
          }

          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw "$($bad.Count) backend-module symbol(s) referenced directly - resolve them through ggml_backend_reg_get_proc_address() instead"
          }
          Write-Host "no backend entry point is referenced outside comments and registry lookups ($($syms.Count) checked)"
          exit 0

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "${{ github.event.inputs.cuda_version }}"

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build

          # Both UI paths are disabled explicitly (LLAMA_BUILD_UI=OFF and
          # LLAMA_USE_PREBUILT_UI=OFF below). LLAMA_BUILD_UI=OFF alone still lets
          # the llama-ui-assets target download a prebuilt dist at build time from
          # the moving ggml-org/llama-ui HF bucket (LLAMA_USE_PREBUILT_UI defaults
          # to ON), and that dist no longer ships loading.html which this
          # llama.cpp snapshot's llama-ui-embed still hard-requires.
          #
          # GGML_MAX_NAME=128 overrides the upstream default (64) so the ggml_tensor
          # layout matches the other ggml runtimes linked into the same app
          # (SeasonGGML, stable-diffusion and qwentts all build with 128).
          $cmakeArgs = @(
            '..',
            '-G', 'Ninja',
            '-DCMAKE_C_COMPILER=cl.exe',
            '-DCMAKE_CXX_COMPILER=cl.exe',
            "-DCMAKE_BUILD_TYPE=${{ github.event.inputs.configuration }}",
            '-DCMAKE_C_FLAGS=/DGGML_MAX_NAME=128',
            '-DCMAKE_CXX_FLAGS=/bigobj /DGGML_MAX_NAME=128',
            '-DBUILD_SHARED_LIBS=ON',
            '-DLLAMA_BUILD_TESTS=OFF',
            '-DLLAMA_BUILD_EXAMPLES=OFF',
            '-DLLAMA_BUILD_TOOLS=ON',
            '-DLLAMA_BUILD_SERVER=ON',
            '-DLLAMA_BUILD_APP=ON',
            '-DLLAMA_BUILD_UI=OFF',
            '-DLLAMA_USE_PREBUILT_UI=OFF',
            '-DLLAMA_OPENSSL=OFF',
            '-DGGML_BACKEND_DL=ON',
            '-DGGML_NATIVE=OFF',
            # Same CPU module layout as SeasonGGML / SeasonImage / SeasonTTS /
            # SeasonThreeD: ggml-cpu.dll dispatches to the per-ISA modules next to it.
            # Without this the package would ship a single baseline ggml-cpu.dll, so a
            # folder holding copies from several packages would end up with whichever
            # layout was extracted last.
            '-DGGML_CPU_ALL_VARIANTS=ON',
            '-DGGML_AVX2=ON',
            '-DGGML_CUDA=ON',
            '-DGGML_VULKAN=ON',
            '-DGGML_CUDA_CUB_3DOT2=ON',
            # nvcc takes -D, not cl's /D: a bare /D... is parsed as an input file, so the
            # CUDA compiler test dies with "A single input file is required for a non-link
            # phase when an outputfile is specified". -Xcudafe uses '=' so the flag string
            # carries no embedded quotes.
            '-DCMAKE_CUDA_FLAGS=-Xcudafe=--diag_suppress=177 -Xcudafe=--diag_suppress=550 -DGGML_MAX_NAME=128',
            '-DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures }}'
          )

          Write-Host "Running: cmake $($cmakeArgs -join ' ')"
          & cmake @cmakeArgs

      - name: Build
        working-directory: build
        shell: pwsh
        run: |
          cmake --build . --config "${{ github.event.inputs.configuration }}" --parallel "${{ github.event.inputs.build_parallel }}"

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = "out/runtimes/win-x64/native/multi-backend"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $binDir = Join-Path $PWD "build/bin"
          if (-not (Test-Path $binDir)) {
            throw "build/bin not found"
          }

          Copy-Item LICENSE -Destination (Join-Path $out "llama.cpp.txt")
          if (Test-Path "ggml/LICENSE") {
            Copy-Item "ggml/LICENSE" -Destination (Join-Path $out "ggml.txt")
          }

          foreach ($header in @("include/llama.h", "include/llama-cpp.h")) {
            if (Test-Path $header) {
              Copy-Item $header -Destination $out -Force
            }
          }

          Copy-Item (Join-Path $binDir '*') -Destination $out -Recurse -Force

          Get-ChildItem build -Recurse -File -Include "*.lib", "*.pdb" | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $out $_.Name) -Force
          }

          if (-not $env:CUDA_PATH) {
            throw "CUDA_PATH is not set after installing CUDA Toolkit."
          }

          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          if (-not (Test-Path $cudaBin)) {
            throw "CUDA bin directory not found: $cudaBin"
          }

          $cudaLib = Join-Path $env:CUDA_PATH "lib\x64"
          $cudaSeries = ("${{ github.event.inputs.cuda_version }}" -split '\.')[0..1] -join "."
          $searchRoots = @($cudaBin)
          if (Test-Path $cudaLib) {
            $searchRoots += $cudaLib
          }

          function Copy-MatchingFiles {
            param(
              [string[]]$Roots,
              [string[]]$Patterns,
              [string]$Destination
            )

            $copied = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)

            foreach ($root in $Roots) {
              if (-not (Test-Path $root)) {
                continue
              }

              foreach ($pattern in $Patterns) {
                Get-ChildItem -Path $root -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object {
                  $destPath = Join-Path $Destination $_.Name
                  Copy-Item $_.FullName -Destination $destPath -Force
                  $null = $copied.Add($_.Name)
                }
              }
            }

            return @($copied | Sort-Object)
          }

          function Get-LatestNvidiaRedistArchiveUrl {
            param(
              [string]$Component,
              [string]$Series
            )

            $indexUrl = "https://developer.download.nvidia.com/compute/cuda/redist/$Component/windows-x86_64/"
            $response = Invoke-WebRequest -Uri $indexUrl -UseBasicParsing
            $escapedComponent = [regex]::Escape($Component)
            $escapedSeries = [regex]::Escape($Series)
            $regex = [regex]"$escapedComponent-windows-x86_64-($escapedSeries(?:\.\d+)+)-archive\.zip"

            $archives = foreach ($match in $regex.Matches($response.Content)) {
              [pscustomobject]@{
                FileName = $match.Value
                Version  = [version]$match.Groups[1].Value
              }
            }

            $latest = $archives | Sort-Object Version -Descending | Select-Object -First 1
            if ($null -eq $latest) {
              return $null
            }

            return $indexUrl + $latest.FileName
          }

          function Ensure-ComponentDlls {
            param(
              [string]$Name,
              [string[]]$Patterns,
              [string]$RedistComponent,
              [bool]$Required
            )

            $copied = Copy-MatchingFiles -Roots $searchRoots -Patterns $Patterns -Destination $out
            if ($copied.Count -gt 0) {
              Write-Host "$Name DLLs copied from installed toolkit: $($copied -join ', ')"
              return
            }

            Write-Warning "No local DLLs found for $Name under: $($searchRoots -join '; ')"

            if ([string]::IsNullOrWhiteSpace($RedistComponent)) {
              if ($Required) {
                throw "Missing required CUDA DLLs for component '$Name'."
              }
              return
            }

            $archiveUrl = Get-LatestNvidiaRedistArchiveUrl -Component $RedistComponent -Series $cudaSeries
            if ([string]::IsNullOrWhiteSpace($archiveUrl)) {
              if ($Required) {
                throw "No NVIDIA redist archive found for component '$RedistComponent' in CUDA series $cudaSeries."
              }
              Write-Warning "No NVIDIA redist archive found for optional component '$RedistComponent' in CUDA series $cudaSeries."
              return
            }

            $downloadRoot = Join-Path $env:RUNNER_TEMP "cuda-redist"
            $extractRoot = Join-Path $downloadRoot "extract-$Name"
            New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null
            if (Test-Path $extractRoot) {
              Remove-Item -Path $extractRoot -Recurse -Force
            }

            $archiveName = Split-Path $archiveUrl -Leaf
            $archivePath = Join-Path $downloadRoot $archiveName
            Write-Host "Downloading fallback redist for ${Name}: $archiveUrl"
            Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath -UseBasicParsing
            Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force

            $copied = Copy-MatchingFiles -Roots @($extractRoot) -Patterns $Patterns -Destination $out
            if ($copied.Count -gt 0) {
              Write-Host "$Name DLLs copied from NVIDIA redist: $($copied -join ', ')"
              return
            }

            if ($Required) {
              throw "Missing required CUDA DLLs for component '$Name' even after downloading NVIDIA redist archive '$archiveName'."
            }

            Write-Warning "Optional component '$Name' was not found even after downloading NVIDIA redist archive '$archiveName'."
          }

          Ensure-ComponentDlls -Name "cudart" -Patterns @("cudart64_*.dll", "cudart*.dll") -RedistComponent "cuda_cudart" -Required $true
          Ensure-ComponentDlls -Name "cublas" -Patterns @("cublas64_*.dll", "cublas*.dll", "cublasLt64_*.dll", "cublasLt*.dll") -RedistComponent "libcublas" -Required $true
          Ensure-ComponentDlls -Name "cufft" -Patterns @("cufft64_*.dll", "cufft*.dll") -RedistComponent "libcufft" -Required $false
          Ensure-ComponentDlls -Name "curand" -Patterns @("curand64_*.dll", "curand*.dll") -RedistComponent "libcurand" -Required $false
          Ensure-ComponentDlls -Name "cusparse" -Patterns @("cusparse64_*.dll", "cusparse*.dll") -RedistComponent "libcusparse" -Required $false
          Ensure-ComponentDlls -Name "nvJitLink" -Patterns @("nvJitLink_*.dll", "nvJitLink*.dll") -RedistComponent "libnvjitlink" -Required $false
          Ensure-ComponentDlls -Name "nvrtc" -Patterns @("nvrtc64_*.dll", "nvrtc*.dll") -RedistComponent "cuda_nvrtc" -Required $false
          Ensure-ComponentDlls -Name "cudnn" -Patterns @("cudnn*.dll") -RedistComponent "" -Required $false

          # The runtime the model is loaded through, asserted rather than assumed:
          # bin/ is copied wholesale, so a configure change that stops emitting one of
          # these would otherwise only surface on a user's machine. ggml-cpu.dll is a
          # dispatcher now (GGML_CPU_ALL_VARIANTS=ON) and is useless without the per-ISA
          # modules beside it - hence the count, not just the name.
          foreach ($name in @("ggml.dll", "ggml-base.dll", "ggml-cuda.dll", "ggml-vulkan.dll")) {
            if (-not (Test-Path (Join-Path $out $name))) {
              throw "Required GGML runtime is missing: $name"
            }
          }
          $cpuBackends = @(Get-ChildItem $out -File | Where-Object { $_.Name -like 'ggml-cpu*.dll' } | Sort-Object Name)
          if ($cpuBackends.Count -lt 2) {
            throw "No per-ISA CPU GGML modules were produced (GGML_CPU_ALL_VARIANTS=ON expects ggml-cpu.dll plus ggml-cpu-<variant>.dll): $($cpuBackends.Name -join ', ')"
          }
          Write-Host ("ggml runtime packaged: {0}" -f (($cpuBackends | ForEach-Object { $_.Name }) -join ', '))

          # ... and then none of them travel with the package. The CUDA runtime belongs
          # to cudacudnn-runtime, which SeasonStudio.csproj stages next to every AI
          # package in exactly this version; keeping a second copy here cost up to
          # ~700 MB of download per artifact (cublasLt64_12 alone is ~500 MB). The
          # checks above stay, because they prove the DLLs this build linked against
          # exist - they just do not leave the runner.
          $notPackaged = @(Get-ChildItem $out -File | Where-Object {
            $_.Name -match '^(cudart|cublas|cublasLt|nvrtc|cufft|curand|cusparse|nvJitLink)\d+_\d+\.dll$' -or
            $_.Name -like 'cudnn*.dll'
          })
          foreach ($dll in $notPackaged) { Remove-Item $dll.FullName -Force }
          Write-Host ("not packaged (cudacudnn-runtime provides them): {0}" -f (($notPackaged | ForEach-Object { $_.Name }) -join ', '))

          $manifest = Join-Path $out "README.txt"
          @(
            "LLAMA_REPO: https://github.com/${{ env.LLAMA_REPO }}",
            "LLAMA_REF: ${{ github.event.inputs.llama_ref }}",
            "Enabled backends: cpu-all-variants, cuda12, vulkan",
            "Configuration: ${{ github.event.inputs.configuration }}",
            "GGML_REPO: ${{ env.GGML_REPO }}",
            "GGML_REF: ${{ github.event.inputs.ggml_ref }}",
            "GGML_MAX_NAME: 128",
            "CUDA runtime: not packaged - cudart / cublas / cublasLt come from cudacudnn-runtime",
            "CUDA Toolkit version: ${{ github.event.inputs.cuda_version }}",
            "",
            "This build packages llama.cpp for win-x64 with shared ggml backends, keeping CPU AVX2, CUDA and Vulkan available from one multi-backend runtime folder.",
            "",
            "The builds carry no embedded web UI (LLAMA_BUILD_UI=OFF, LLAMA_USE_PREBUILT_UI=OFF: no npm build and no prebuilt UI download); llama-server serves the HTTP API only.",
            "",
            "Artifact contents:"
          ) | Set-Content -Path $manifest -Encoding ascii

          Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            Add-Content -Path $manifest -Value $_.Name -Encoding ascii
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-llama-win-x64-multi-backend-${{ github.event.inputs.configuration }}
          path: out/runtimes/win-x64/native/multi-backend/
          if-no-files-found: error

  build-linux:
    # Runs only when build_target is linux; every other build job is gated the
    # same way, so exactly one build job executes per workflow run.
    if: github.event.inputs.build_target == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout SeasonRealms/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_REPO }}
          ref: ${{ github.event.inputs.llama_ref }}
          submodules: false

      - name: Replace ggml with SeasonRealms fork
        run: |
          rm -rf ggml
          git clone "https://github.com/${{ env.GGML_REPO }}.git" ggml
          git -C ggml fetch --depth 1 origin "${{ github.event.inputs.ggml_ref }}"
          git -C ggml checkout FETCH_HEAD
          git -C ggml rev-parse HEAD

      # Same guard as the Windows lane, same symbol set, same filtering: see the
      # comment there for why GGML_BACKEND_DL=ON makes a direct call to a backend
      # entry point unlinkable. Kept as a shell script rather than shared with the
      # Windows step because the two lanes already use their platform's shell
      # everywhere else; the logic below is the same line for line.
      - name: Check sources stay on the backend registry API
        run: |
          set -euo pipefail
          src='.'
          ggml_inc='ggml/include'
          exempt=''
          skip='ggml docs pocs examples tests tools/cvector-generator tools/export-lora'

          # Entry point = the identifier right before '(' on a GGML_BACKEND_API line.
          syms=$(for h in ggml-cpu.h ggml-cuda.h ggml-vulkan.h ggml-metal.h; do
                   if [ -f "$ggml_inc/$h" ]; then cat "$ggml_inc/$h"; fi
                 done | awk '
                   /GGML_BACKEND_API/ {
                     i = index($0, "(")
                     if (i == 0) next
                     head = substr($0, 1, i - 1)
                     if (match(head, /[A-Za-z_][A-Za-z0-9_]*[ \t]*$/)) {
                       name = substr(head, RSTART, RLENGTH)
                       gsub(/[ \t]+/, "", name)
                       print name
                     }
                   }' | sort -u)
          if [ -n "$exempt" ]; then
            syms=$(printf '%s\n' "$syms" | grep -v -x -E "$exempt")
          fi

          # Fail closed: a silently empty set would leave this step green forever.
          count=$(printf '%s\n' "$syms" | grep -c . || true)
          if [ "$count" -lt 60 ]; then
            echo "::error::read only $count backend entry points from $ggml_inc - ggml's headers changed shape and the guard cannot be trusted"
            exit 1
          fi

          pattern=$(printf '%s\n' "$syms" | paste -sd'|')
          excludes=()
          for d in $skip; do excludes+=(":(exclude)$d"); done
          raw=$(git -C "$src" grep --untracked -n -I -w -E "$pattern" -- . "${excludes[@]}" || true)

          # Comments and string literals are stripped first, so a symbol that only
          # appears as a get_proc_address() name or in a comment is not a reference.
          bad=$(printf '%s\n' "$raw" |
                  grep -v -E 'get_proc_address|decltype' |
                  sed -E 's/"[^"]*"/""/g; s#//.*##; s#/\*[^*]*\*/##g' |
                  grep -w -E "$pattern" || true)

          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::backend-module symbol(s) referenced directly - resolve them through ggml_backend_reg_get_proc_address() instead"
            exit 1
          fi
          echo "no backend entry point is referenced outside comments and registry lookups ($count checked)"

      # Same build-time toolchain as the Windows job: Vulkan SDK for ggml-vulkan
      # (provides glslc) and CUDA Toolkit for ggml-cuda (nvcc + cudart + cuBLAS).
      # The toolkit is build-time only: CUDA runtimes are NOT bundled into the
      # artifact (mirroring Windows, where cudacudnn-runtime is packaged
      # separately). Users install CUDA 12.x system-wide per the documented
      # guidance, so no CUDA .so files are collected.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1

      # Linux sub-package names get the "cuda-" prefix added automatically
      # (nvcc -> cuda-nvcc), while the cuBLAS packages live outside that
      # namespace and must be requested through non-cuda-sub-packages.
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "${{ github.event.inputs.cuda_version }}"
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Configure CMake
        run: |
          # Both UI paths are disabled explicitly (LLAMA_BUILD_UI=OFF and
          # LLAMA_USE_PREBUILT_UI=OFF below). LLAMA_BUILD_UI=OFF alone still lets
          # the llama-ui-assets target download a prebuilt dist at build time from
          # the moving ggml-org/llama-ui HF bucket (LLAMA_USE_PREBUILT_UI defaults
          # to ON), and that dist no longer ships loading.html which this
          # llama.cpp snapshot's llama-ui-embed still hard-requires.
          # GGML_MAX_NAME=128 overrides the upstream default (64) so the ggml_tensor
          # layout matches the other ggml runtimes linked into the same app
          # (SeasonGGML, stable-diffusion and qwentts all build with 128).
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ github.event.inputs.configuration }}" \
            -DCMAKE_C_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_CXX_FLAGS="-DGGML_MAX_NAME=128" \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_APP=ON \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_CUDA=ON \
            -DGGML_VULKAN=ON \
            -DGGML_CUDA_CUB_3DOT2=ON \
            -DCMAKE_CUDA_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_CUDA_ARCHITECTURES="${{ github.event.inputs.cuda_architectures }}"

      - name: Build
        run: |
          cmake --build build --config "${{ github.event.inputs.configuration }}" --parallel "${{ github.event.inputs.build_parallel }}"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          out="out/runtimes/linux-x64/native/multi-backend"
          mkdir -p "$out"

          if [ ! -d build/bin ]; then
            echo "build/bin not found" >&2
            exit 1
          fi

          cp LICENSE "$out/llama.cpp.txt"
          if [ -f ggml/LICENSE ]; then
            cp ggml/LICENSE "$out/ggml.txt"
          fi

          for header in include/llama.h include/llama-cpp.h; do
            if [ -f "$header" ]; then
              cp "$header" "$out"
            fi
          done

          # Everything the build placed in build/bin: shared libraries and the
          # llama-cli / llama-server tools, mirroring the Windows job. -L
          # dereferences the SONAME symlink chains so the artifact carries real
          # files under every name that dlopen and the linker-recorded SONAMEs
          # look for at runtime.
          cp -RL build/bin/. "$out/"

          for name in libllama.so libggml.so libggml-base.so libggml-cpu.so libggml-cuda.so libggml-vulkan.so; do
            if [ ! -f "$out/$name" ]; then
              echo "Required llama.cpp runtime is missing: $name" >&2
              exit 1
            fi
          done

          {
            echo "LLAMA_REPO: https://github.com/${{ env.LLAMA_REPO }}"
            echo "LLAMA_REF: ${{ github.event.inputs.llama_ref }}"
            echo "Enabled backends: cpu-avx2, cuda12, vulkan"
            echo "Configuration: ${{ github.event.inputs.configuration }}"
            echo "GGML_REPO: ${{ env.GGML_REPO }}"
            echo "GGML_REF: ${{ github.event.inputs.ggml_ref }}"
            echo "GGML_MAX_NAME: 128"
            echo "CUDA Toolkit version (build time only): ${{ github.event.inputs.cuda_version }}"
            echo ""
            echo "This build packages llama.cpp for linux-x64 with shared ggml backends, keeping CPU AVX2, CUDA and Vulkan available from one multi-backend runtime folder."
            echo ""
            echo "The builds carry no embedded web UI (LLAMA_BUILD_UI=OFF, LLAMA_USE_PREBUILT_UI=OFF: no npm build and no prebuilt UI download); llama-server serves the HTTP API only."
            echo ""
            echo "CUDA and cuDNN runtimes are NOT bundled: install CUDA 12.x system-wide for the CUDA backend."
            echo ""
            echo "Artifact contents:"
            (cd "$out" && ls -1 | sort)
          } > "$out/README.txt"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-llama-linux-x64-multi-backend-${{ github.event.inputs.configuration }}
          path: out/runtimes/linux-x64/native/multi-backend/
          if-no-files-found: error

  build-maccatalyst:
    # Runs only when build_target is maccatalyst; every other build job is gated the
    # same way, so exactly one build job executes per workflow run.
    if: github.event.inputs.build_target == 'maccatalyst'
    # Apple Silicon only: macos-15 is already arm64, so this is a native build.
    # Intel Macs (x86_64 / maccatalyst-x64) are deliberately not produced - see the
    # generated README.txt for what that costs.
    runs-on: macos-15
    timeout-minutes: 180

    env:
      RID: maccatalyst-arm64
      ARCH: arm64

    steps:
      - name: Checkout SeasonRealms/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_REPO }}
          ref: ${{ github.event.inputs.llama_ref }}
          submodules: false

      - name: Replace ggml with SeasonRealms fork
        run: |
          set -euo pipefail

          if [ -d ggml ]; then
            rm -rf ggml
          fi

          git clone "https://github.com/${{ env.GGML_REPO }}.git" ggml
          git -C ggml fetch --depth 1 origin "${{ github.event.inputs.ggml_ref }}"
          git -C ggml checkout FETCH_HEAD
          git -C ggml rev-parse HEAD

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Ninja
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          ninja --version

      - name: Configure CMake
        env:
          MIN_IOS: ${{ github.event.inputs.maccatalyst_min_ios }}
          ENABLE_BLAS: ${{ github.event.inputs.maccatalyst_blas }}
        run: |
          set -euo pipefail

          # Mac Catalyst is not a CMAKE_SYSTEM_NAME. The supported way to target it
          # is: keep the Darwin/macOS SDK and switch the clang target triple to
          # <arch>-apple-ios<ver>-macabi. CMAKE_OSX_DEPLOYMENT_TARGET must stay empty,
          # otherwise CMake injects -mmacosx-version-min=, which conflicts with -target.
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TRIPLE="${ARCH}-apple-ios${MIN_IOS}-macabi"

          # ggml_get_system_arch() compares CMAKE_OSX_ARCHITECTURES with STREQUAL, so it
          # must hold exactly "arm64" for GGML_SYSTEM_ARCH to resolve to "ARM"; only then
          # does GGML_CPU_ARM_ARCH take effect (-march=armv8.2-a+dotprod). A universal
          # arm64;x86_64 value would not match and would fall back to the host
          # CMAKE_SYSTEM_PROCESSOR. armv8.2-a+dotprod is exactly the apple_m1 baseline, so
          # M1 and every later Apple Silicon chip run it.
          CAT_FLAGS="-target ${TRIPLE}"
          CAT_FLAGS="${CAT_FLAGS} -isystem ${SDK_PATH}/System/iOSSupport/usr/include"
          CAT_FLAGS="${CAT_FLAGS} -iframework ${SDK_PATH}/System/iOSSupport/System/Library/Frameworks"

          # GGML_MAX_NAME=128 overrides the upstream default (64) so the ggml_tensor
          # layout matches the other ggml runtimes linked into the same app
          # (SeasonGGML, stable-diffusion and qwentts all build with 128).
          CAT_FLAGS="${CAT_FLAGS} -DGGML_MAX_NAME=128"

          LINK_FLAGS="-target ${TRIPLE}"
          LINK_FLAGS="${LINK_FLAGS} -L${SDK_PATH}/System/iOSSupport/usr/lib"
          LINK_FLAGS="${LINK_FLAGS} -F${SDK_PATH}/System/iOSSupport/System/Library/Frameworks"

          BUILD_DIR="${PWD}/build"

          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ github.event.inputs.configuration }}" \
            -DCMAKE_OSX_SYSROOT="${SDK_PATH}" \
            -DCMAKE_OSX_ARCHITECTURES="${ARCH}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET= \
            -DCMAKE_C_FLAGS="${CAT_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${CAT_FLAGS}" \
            -DCMAKE_OBJC_FLAGS="${CAT_FLAGS}" \
            -DCMAKE_OBJCXX_FLAGS="${CAT_FLAGS}" \
            -DCMAKE_ASM_FLAGS="${CAT_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${LINK_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${LINK_FLAGS}" \
            -DCMAKE_MODULE_LINKER_FLAGS="${LINK_FLAGS}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_MTMD=ON \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DGGML_ACCELERATE=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NDEBUG=ON \
            -DGGML_BLAS="${ENABLE_BLAS}" \
            -DGGML_BLAS_VENDOR=Apple \
            -DGGML_OPENMP=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build --parallel "${{ github.event.inputs.build_parallel }}"

      - name: Link single self-contained dylib
        env:
          MIN_IOS: ${{ github.event.inputs.maccatalyst_min_ios }}
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TRIPLE="${ARCH}-apple-ios${MIN_IOS}-macabi"

          # A static build (BUILD_SHARED_LIBS=OFF, GGML_BACKEND_DL=OFF) leaves llama and
          # every ggml piece as a separate .a. Merge them into ONE dylib with
          # -force_load: the CPU / Metal / BLAS backends are only reached through ggml's
          # backend registry at runtime and the embedded Metal library is only referenced
          # from assembly, so without -force_load the linker would drop those object files.
          archives=""
          for a in libllama.a libggml-base.a libggml.a libggml-cpu.a libggml-metal.a libggml-blas.a; do
            found="$(find build -name "$a" | head -n1)"
            if [ -n "$found" ]; then
              archives="${archives} -Wl,-force_load,${found}"
            fi
          done

          # llama and the ggml core archives are mandatory; the backend archives depend
          # on the enabled backends, so only their absence for a required backend would
          # surface later.
          for req in libllama.a libggml-base.a libggml.a libggml-cpu.a libggml-metal.a; do
            if ! find build -name "$req" | grep -q .; then
              echo "Required static archive is missing: $req" >&2
              exit 1
            fi
          done

          # mtmd (multimodal helpers) is explicitly enabled via LLAMA_BUILD_MTMD so its
          # objects are merged too and libllama.dylib exports the mtmd_* entry points
          # SeasonLLM P/Invokes through its "mtmd" binding. mtmd links only ggml/llama,
          # so it contributes no extra framework dependencies.
          MTMD_ARCHIVE="$(find build -name "libmtmd*.a" | head -n1)"
          if [ -n "$MTMD_ARCHIVE" ]; then
            archives="${archives} -Wl,-force_load,${MTMD_ARCHIVE}"
          else
            echo "mtmd archive is missing despite LLAMA_BUILD_MTMD=ON" >&2
            exit 1
          fi

          # Reuse the Catalyst search paths so Foundation/Metal/MetalKit/Accelerate resolve
          # against the macabi framework variants under the macOS SDK.
          LINK_FLAGS="-target ${TRIPLE} -isysroot ${SDK_PATH}"
          LINK_FLAGS="${LINK_FLAGS} -L${SDK_PATH}/System/iOSSupport/usr/lib"
          LINK_FLAGS="${LINK_FLAGS} -F${SDK_PATH}/System/iOSSupport/System/Library/Frameworks"

          mkdir -p build/merged
          clang++ -dynamiclib ${LINK_FLAGS} \
            -install_name @rpath/libllama.dylib \
            ${archives} \
            -framework Foundation -framework Metal -framework MetalKit \
            -framework Accelerate \
            -o build/merged/libllama.dylib

          # libmtmd.dylib is a thin re-export shim: it carries no code of its own and
          # forwards every symbol to libllama.dylib, so DllImport("mtmd") and
          # DllImport("llama") share one copy of llama/ggml state in the process.
          clang++ -dynamiclib ${LINK_FLAGS} \
            -install_name @rpath/libmtmd.dylib \
            -Xlinker -reexport_library -Xlinker build/merged/libllama.dylib \
            -o build/merged/libmtmd.dylib

          # The merged dylib must export the entry points SeasonLLM P/Invokes; a dropped
          # backend object or an unresolved symbol shows up as a missing export here.
          # Read nm once into a variable and match with a here-string: piping nm into
          # grep -q lets grep close the pipe on the first match, which makes llvm-nm abort
          # with "Broken pipe" and, under set -o pipefail, fails the whole pipeline even
          # though the symbol was found.
          nmOut="$(nm -gU build/merged/libllama.dylib)"
          for sym in _llama_backend_init _llama_model_default_params _llama_context_default_params _llama_sampler_chain_default_params; do
            if ! grep -q " ${sym}$" <<< "$nmOut"; then
              echo "Merged dylib does not export ${sym}" >&2
              exit 1
            fi
          done

          if [ -n "$MTMD_ARCHIVE" ]; then
            for sym in _mtmd_default_marker _mtmd_init_from_file; do
              if ! grep -q " ${sym}$" <<< "$nmOut"; then
                echo "Merged dylib does not export ${sym}" >&2
                exit 1
              fi
            done
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail

          out="out/runtimes/${RID}/native/multi-backend"
          mkdir -p "$out"

          cp LICENSE "$out/llama.cpp.txt"
          if [ -f "ggml/LICENSE" ]; then
            cp "ggml/LICENSE" "$out/ggml.txt"
          fi

          for header in llama.h llama-cpp.h; do
            if [ -f "include/${header}" ]; then
              cp "include/${header}" "$out/"
            fi
          done

          # Single statically-linked runtime: CPU (armv8.2-a+dotprod baseline), Metal and
          # BLAS are compiled in and registered by ggml on first use - there are no
          # loadable .so backend modules and nothing is dlopen'd. SeasonLLM P/Invokes
          # "llama" and "mtmd"; libmtmd.dylib re-exports libllama.dylib, so both bindings
          # resolve against this single Mach-O.
          cp build/merged/libllama.dylib "$out/libllama.dylib"
          cp build/merged/libmtmd.dylib "$out/libmtmd.dylib"

          if [ ! -f "$out/libllama.dylib" ]; then
            echo "Required llama.cpp runtime is missing: libllama.dylib" >&2
            exit 1
          fi

          # Fail loudly if the runtime was built for plain macOS, for Intel, or as a fat
          # binary - such a library loads on the runner but not inside the Catalyst app.
          lib="$out/libllama.dylib"
          archInfo="$(lipo -info "$lib")"
          if ! echo "$archInfo" | grep -q "${ARCH}"; then
            echo "Missing ${ARCH} slice in $lib: $archInfo" >&2
            exit 1
          fi
          if echo "$archInfo" | grep -q 'x86_64\|i386'; then
            echo "Unexpected Intel slice in $lib: $archInfo" >&2
            exit 1
          fi
          if ! xcrun vtool -show-build-version "$lib" | grep -q "MACCATALYST"; then
            echo "Not built for Mac Catalyst: $lib" >&2
            xcrun vtool -show-build-version "$lib" >&2
            exit 1
          fi

          # Record the artifact checksum so the dylib can be verified after download.
          # Transferring the binary through text-mode channels (sync tools, text editors,
          # some file shares) corrupts the Mach-O header into UTF-8 replacement characters;
          # this is how a downstream user detects that before it reaches a device.
          libsha256=$(shasum -a 256 "$out/libllama.dylib" | awk '{print $1}')

          manifest="$out/README.txt"
          {
            echo "LLAMA_REPO: https://github.com/${{ env.LLAMA_REPO }}"
            echo "LLAMA_REF: ${{ github.event.inputs.llama_ref }}"
            echo "GGML_REPO: https://github.com/${{ env.GGML_REPO }}"
            echo "GGML_REF: ${{ github.event.inputs.ggml_ref }}"
            echo "GGML_MAX_NAME: 128"
            echo "Configuration: ${{ github.event.inputs.configuration }}"
            echo "RID: ${RID}"
            echo "Target triple: ${ARCH}-apple-ios${{ github.event.inputs.maccatalyst_min_ios }}-macabi"
            echo "Linkage: static (BUILD_SHARED_LIBS=OFF, GGML_BACKEND_DL=OFF), merged into a single libllama.dylib"
            echo "Enabled backends: cpu (armv8.2-a+dotprod), metal, blas=${{ github.event.inputs.maccatalyst_blas }}"
            echo ""
            echo "This build packages a single self-contained llama.cpp runtime for ${RID}."
            echo "Apple Silicon only: no x86_64 slice is produced, so this runtime does not load on Intel Macs. Add a maccatalyst-x64 build if Intel support is needed again."
            echo "Static linkage: llama, ggml and every backend are archived into libllama.dylib and registered at runtime by ggml's backend registry; nothing is dlopen'd, so the app bundle contains a single Mach-O to sign."
            echo "libmtmd.dylib is a thin re-export shim forwarding every symbol to libllama.dylib, so DllImport(\"mtmd\") and DllImport(\"llama\") share one copy of llama/ggml state."
            echo "CPU targets the M1 baseline (armv8.2-a+dotprod). GGML_CPU_ALL_VARIANTS is intentionally NOT used because it requires GGML_BACKEND_DL; M1 and every later Apple Silicon chip run this baseline."
            echo "Metal uses GGML_METAL_EMBED_LIBRARY so the shader source travels inside libllama.dylib; no default.metallib has to be deployed or located in the app bundle."
            echo "Metal targets the Apple Silicon unified-memory GPU only; Intel integrated and AMD discrete GPUs are out of scope for this artifact."
            echo "CUDA and Vulkan are unavailable on Mac Catalyst and are explicitly disabled."
            echo "Command line tools (llama-cli, llama-server) are not built for Mac Catalyst: this artifact is the native library consumed by SeasonLLM through P/Invoke."
            echo ""
            echo "libllama.dylib sha256: ${libsha256}"
            echo "Artifact contents:"
            (cd "$out" && ls | sort)
          } > "$manifest"

          cat "$manifest"

      - name: Upload Mac Catalyst artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-llama-${{ env.RID }}-multi-backend-${{ github.event.inputs.configuration }}
          path: out/runtimes/${{ env.RID }}/native/multi-backend/
          if-no-files-found: error

  build-ios:
    # Runs only when build_target is ios; every other build job is gated the same
    # way, so exactly one build job executes per workflow run.
    if: github.event.inputs.build_target == 'ios'
    # Apple Silicon only (same policy as the Mac Catalyst job): macos-15 is already
    # arm64, so both slices are native builds. A single "arm64" iOS target does NOT
    # also cover the simulator - device and simulator are distinct Mach-O platforms
    # (LC_BUILD_VERSION reports IOS vs IOSSIMULATOR) built against different SDKs, so
    # each needs its own compile. With Intel Macs out of scope the complete matrix is
    # exactly two slices: device arm64 + simulator arm64; no x86_64 simulator slice is
    # produced.
    runs-on: macos-15
    timeout-minutes: 240

    env:
      RID: ios-arm64
      ARCH: arm64
      MIN_IOS: ${{ github.event.inputs.ios_deployment_target }}
      ENABLE_BLAS: ${{ github.event.inputs.ios_blas }}

    steps:
      - name: Checkout SeasonRealms/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_REPO }}
          ref: ${{ github.event.inputs.llama_ref }}
          submodules: false

      - name: Replace ggml with SeasonRealms fork
        run: |
          set -euo pipefail

          if [ -d ggml ]; then
            rm -rf ggml
          fi

          git clone "https://github.com/${{ env.GGML_REPO }}.git" ggml
          git -C ggml fetch --depth 1 origin "${{ github.event.inputs.ggml_ref }}"
          git -C ggml checkout FETCH_HEAD
          git -C ggml rev-parse HEAD

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Ninja
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          ninja --version

      - name: Configure + build (iOS device arm64)
        run: |
          set -euo pipefail

          # CMAKE_SYSTEM_NAME=iOS is CMake's first-class iOS cross-compilation mode:
          # it selects the iphoneos SDK, the -mios-version-min flag and the arm64
          # target triple, so no manual -target/-isysroot flags are needed (unlike the
          # *-macabi build above, for which CMake has no system name to switch on).
          # The behavioral flags mirror the Mac Catalyst job: one static, registry-
          # driven runtime with CPU (M1 baseline), Metal and optional Accelerate BLAS.
          # Unlike the self-contained Mac Catalyst dylib, this archive is linked into
          # apps that also carry the qwentts / stable-diffusion / SeasonGGML ggml
          # runtimes (and every one of those builds with GGML_MAX_NAME=128), so ggml
          # is compiled with the same override to keep the shared ggml_tensor struct
          # layout ABI-consistent when several runtimes coexist in one app.
          cmake -S . -B build-ios-device -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="${ARCH}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MIN_IOS}" \
            -DCMAKE_C_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_CXX_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_OBJC_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_OBJCXX_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_BUILD_TYPE="${{ github.event.inputs.configuration }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_MTMD=ON \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DGGML_ACCELERATE=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NDEBUG=ON \
            -DGGML_BLAS="${ENABLE_BLAS}" \
            -DGGML_BLAS_VENDOR=Apple \
            -DGGML_OPENMP=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF

          cmake --build build-ios-device --parallel "${{ github.event.inputs.build_parallel }}"

      - name: Configure + build (iOS simulator arm64)
        run: |
          set -euo pipefail

          # Same configuration against the iphonesimulator SDK. On Apple Silicon Macs
          # (the only in-scope debug hosts) the simulator runs the arm64 slice, so
          # arm64 is the only simulator architecture that is produced.
          # GGML_MAX_NAME=128 matches the device slice and the other ggml-based iOS
          # runtimes (see the device step for the rationale).
          cmake -S . -B build-ios-simulator -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="${ARCH}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MIN_IOS}" \
            -DCMAKE_C_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_CXX_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_OBJC_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_OBJCXX_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_BUILD_TYPE="${{ github.event.inputs.configuration }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_MTMD=ON \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DGGML_ACCELERATE=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_NDEBUG=ON \
            -DGGML_BLAS="${ENABLE_BLAS}" \
            -DGGML_BLAS_VENDOR=Apple \
            -DGGML_OPENMP=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF

          cmake --build build-ios-simulator --parallel "${{ github.event.inputs.build_parallel }}"

      - name: Merge static archives into a single libllama.a per slice
        run: |
          set -euo pipefail

          # With BUILD_SHARED_LIBS=OFF and GGML_BACKEND_DL=OFF llama, mtmd and every
          # ggml piece are separate .a files. Merge each slice's archives into ONE
          # libllama.a with libtool: on iOS both the "llama" and "mtmd" P/Invoke
          # bindings are meant to bind as "__Internal" and resolve against this single
          # archive - no re-export shim like the Mac Catalyst libmtmd.dylib is needed,
          # because there is nothing to dlopen and both bindings share one copy of the
          # llama/ggml state by construction.
          merge_slice() {
            local build_dir="$1"
            local out_dir="$2"
            mkdir -p "$out_dir"

            local archives=""
            for a in libllama.a libggml-base.a libggml.a libggml-cpu.a libggml-metal.a libggml-blas.a; do
              found="$(find "$build_dir" -name "$a" | head -n1)"
              if [ -n "$found" ]; then
                archives="${archives} ${found}"
              fi
            done

            # mtmd (multimodal helpers) is explicitly enabled via LLAMA_BUILD_MTMD so
            # its objects are merged too and the "mtmd" binding resolves against the
            # same archive as "llama".
            local mtmd
            mtmd="$(find "$build_dir" -name "libmtmd*.a" | head -n1)"
            if [ -n "$mtmd" ]; then
              archives="${archives} ${mtmd}"
            else
              echo "mtmd archive is missing despite LLAMA_BUILD_MTMD=ON in ${build_dir}" >&2
              exit 1
            fi

            # llama and the ggml core archives are mandatory; the backend archives
            # depend on the enabled backends, so only their absence for a required
            # backend would surface later.
            for req in libllama.a libggml-base.a libggml.a libggml-cpu.a libggml-metal.a; do
              if ! find "$build_dir" -name "$req" | grep -q .; then
                echo "Required static archive is missing in ${build_dir}: $req" >&2
                exit 1
              fi
            done

            # shellcheck disable=SC2086
            libtool -static -o "${out_dir}/libllama.a" ${archives}
          }

          rm -rf merged
          merge_slice build-ios-device merged/device
          merge_slice build-ios-simulator merged/simulator

      - name: Create libllama.xcframework
        run: |
          set -euo pipefail

          # One xcframework carries both slices; xcodebuild classifies each library by
          # its LC_BUILD_VERSION platform tag (ios-arm64 / ios-arm64-simulator), which
          # also implicitly re-validates that the device and simulator builds did not
          # get mixed up.
          xcodebuild -create-xcframework \
            -library merged/device/libllama.a \
            -library merged/simulator/libllama.a \
            -output merged/libllama.xcframework

      - name: Verify slices
        run: |
          set -euo pipefail

          verify_slice() {
            local lib="$1"
            local probe_root="$2"
            local platform_tag="$3"

            local archInfo
            archInfo="$(lipo -info "$lib")"
            if ! echo "$archInfo" | grep -q "${ARCH}"; then
              echo "Missing ${ARCH} slice in ${lib}: ${archInfo}" >&2
              exit 1
            fi
            if echo "$archInfo" | grep -q 'x86_64\|i386'; then
              echo "Unexpected Intel slice in ${lib}: ${archInfo}" >&2
              exit 1
            fi

            # The LC_BUILD_VERSION platform tag must say IOS (device) or IOSSIMULATOR
            # (simulator; anchored so "IOS" cannot match inside "IOSSIMULATOR"). A
            # plain macOS build or a device/simulator mix-up links on the runner but
            # breaks the app build downstream.
            local probe
            probe="$(find "$probe_root" -name "*.o" | head -n1)"
            if [ -z "$probe" ]; then
              echo "No object file under ${probe_root} to verify the platform tag" >&2
              exit 1
            fi
            if ! xcrun vtool -show-build-version "$probe" | grep -q " ${platform_tag}$"; then
              echo "Platform tag mismatch in ${lib} (expected ${platform_tag}):" >&2
              xcrun vtool -show-build-version "$probe" >&2
              exit 1
            fi
          }

          verify_slice merged/device/libllama.a build-ios-device IOS
          verify_slice merged/simulator/libllama.a build-ios-simulator IOSSIMULATOR

          # The merged archives must export the entry points SeasonLLM P/Invokes
          # through both its "llama" and "mtmd" bindings; a dropped backend object or
          # an unresolved symbol shows up as a missing export here. Read nm once into
          # a variable and match with a here-string: piping nm into grep -q lets grep
          # close the pipe on the first match, which makes llvm-nm abort with "Broken
          # pipe" and, under set -o pipefail, fails the whole pipeline even though the
          # symbol was found.
          for lib in merged/device/libllama.a merged/simulator/libllama.a; do
            nmOut="$(nm -g "$lib")"
            for sym in _llama_backend_init _llama_model_default_params _llama_context_default_params _llama_sampler_chain_default_params _mtmd_default_marker _mtmd_init_from_file; do
              if ! grep -q " ${sym}$" <<< "$nmOut"; then
                echo "Merged library does not export ${sym}: ${lib}" >&2
                exit 1
              fi
            done
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail

          out="out/runtimes/${RID}/native/multi-backend"
          mkdir -p "$out"

          cp LICENSE "$out/llama.cpp.txt"
          if [ -f "ggml/LICENSE" ]; then
            cp "ggml/LICENSE" "$out/ggml.txt"
          fi

          for header in llama.h llama-cpp.h; do
            if [ -f "include/${header}" ]; then
              cp "include/${header}" "$out/"
            fi
          done

          rm -rf "$out/libllama.xcframework"
          cp -R merged/libllama.xcframework "$out/libllama.xcframework"

          if [ ! -f "$out/libllama.xcframework/ios-arm64/libllama.a" ] ||
             [ ! -f "$out/libllama.xcframework/ios-arm64-simulator/libllama.a" ]; then
            echo "Required llama.cpp runtime is missing from the xcframework" >&2
            ls -R "$out/libllama.xcframework" >&2
            exit 1
          fi

          # Record the archive checksums so they can be verified after download.
          # Transferring binaries through text-mode channels (sync tools, text
          # editors, some file shares) corrupts the Mach-O headers; this is how a
          # downstream user detects that before it reaches a device.
          devSha=$(shasum -a 256 "$out/libllama.xcframework/ios-arm64/libllama.a" | awk '{print $1}')
          simSha=$(shasum -a 256 "$out/libllama.xcframework/ios-arm64-simulator/libllama.a" | awk '{print $1}')

          manifest="$out/README.txt"
          {
            echo "Platform: ${RID} (multi-backend xcframework carrying the device and arm64-simulator slices)"
            echo "Configuration: ${{ github.event.inputs.configuration }}"
            echo "LLAMA_REPO: https://github.com/${{ env.LLAMA_REPO }}"
            echo "LLAMA_REF: ${{ github.event.inputs.llama_ref }}"
            echo "GGML_REPO: https://github.com/${{ env.GGML_REPO }}"
            echo "GGML_REF: ${{ github.event.inputs.ggml_ref }}"
            echo "Target triples: arm64-apple-ios${{ github.event.inputs.ios_deployment_target }} (device), arm64-apple-ios${{ github.event.inputs.ios_deployment_target }}-simulator (simulator)"
            echo "Linkage: static (BUILD_SHARED_LIBS=OFF, GGML_BACKEND_DL=OFF), merged into a single libllama.a per slice"
            echo "Enabled backends: cpu (armv8.2-a+dotprod), metal, blas=${{ github.event.inputs.ios_blas }}"
            echo "GGML_MAX_NAME: 128"
            echo ""
            echo "This build packages a single self-contained llama.cpp runtime for iOS."
            echo "Two slices only, both arm64: ios-arm64 (device) and ios-arm64-simulator (Apple Silicon Macs). One arm64 iOS target does NOT also cover the simulator - device and simulator are distinct Mach-O platforms; no x86_64 simulator slice is produced, Intel Macs are out of scope."
            echo "On iOS both the llama and mtmd P/Invoke bindings are meant to bind as __Internal (unlike the libllama/libmtmd dylibs used on Mac Catalyst), so the app statically links libllama.a via NativeReference (Kind=Static); the merged archive exports the llama, mtmd and ggml entry points from one file."
            echo "Static linkage: llama, mtmd, ggml and every backend are archived into the single libllama.a and registered at runtime by ggml's backend registry; nothing is dlopen'd."
            echo "Self-contained: a complete ggml build is merged in. If several self-contained ggml-based archives (ggml, llama, qwentts, ...) are linked into the same app, keep exactly one ForceLoad=True owner; otherwise the duplicate ggml objects clash at link time."
            echo "This build compiles ggml with GGML_MAX_NAME=128 (the upstream default is 64) so the ggml_tensor layout matches the other ggml-based runtimes linked into the same app (qwentts, stable-diffusion and SeasonGGML, which all use 128)."
            echo "CPU targets the M1 baseline (armv8.2-a+dotprod), supported by every A12+ device and every Apple Silicon simulator."
            echo "Metal uses GGML_METAL_EMBED_LIBRARY so the shader source travels inside libllama.a; no default.metallib has to be deployed or located in the app bundle."
            echo "BLAS uses Apple's Accelerate framework (GGML_BLAS_VENDOR=Apple), which is available on both iOS devices and simulators."
            echo "CUDA and Vulkan are unavailable on iOS and are explicitly disabled."
            echo "Command line tools (llama-cli, llama-server) are not built for iOS: this artifact is the native library consumed by SeasonLLM through P/Invoke."
            echo ""
            echo "libllama.a sha256 (ios-arm64): ${devSha}"
            echo "libllama.a sha256 (ios-arm64-simulator): ${simSha}"
            echo "Artifact contents:"
            (cd "$out" && find . | sort)
          } > "$manifest"

          cat "$manifest"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-llama-${{ env.RID }}-multi-backend-${{ github.event.inputs.configuration }}
          path: out/runtimes/${{ env.RID }}/native/multi-backend/
          if-no-files-found: error

  build-android:
    # Runs only when build_target is android; every other build job is gated the
    # same way, so exactly one build job executes per workflow run.
    if: github.event.inputs.build_target == 'android'
    # arm64-v8a only: 64-bit real devices are the single supported target, so
    # no emulator (x86_64) and no 32-bit (armeabi-v7a) slice is produced.
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      RID: android-arm64
      ABI: arm64-v8a
      ANDROID_API: "33"

    steps:
      - name: Checkout SeasonRealms/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_REPO }}
          ref: ${{ github.event.inputs.llama_ref }}
          submodules: false

      - name: Replace ggml with SeasonRealms fork
        run: |
          rm -rf ggml
          git clone "https://github.com/${{ env.GGML_REPO }}.git" ggml
          git -C ggml fetch --depth 1 origin "${{ github.event.inputs.ggml_ref }}"
          git -C ggml checkout FETCH_HEAD
          git -C ggml rev-parse HEAD

      # The runner may carry only older NDKs, and the 16 KB page-size default
      # the Play deadline depends on exists from r28 on, so the requested NDK
      # is installed through the preinstalled sdkmanager and the r28 floor is
      # enforced here instead of silently building with an older toolchain.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION="${{ github.event.inputs.android_ndk_version }}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="${SDK_ROOT}/ndk/${NDK_VERSION}"

          if [ ! -d "${NDK_DIR}" ]; then
            if [ ! -x "${SDKMANAGER}" ]; then
              echo "sdkmanager not found at ${SDKMANAGER}" >&2
              exit 1
            fi
            yes | "${SDKMANAGER}" --licenses > /dev/null || true
            "${SDKMANAGER}" --install "ndk;${NDK_VERSION}"
          fi

          NDK_MAJOR="$(sed -n 's/^Pkg.Revision = \([0-9]*\).*/\1/p' "${NDK_DIR}/source.properties")"
          if [ -z "${NDK_MAJOR}" ] || [ "${NDK_MAJOR}" -lt 28 ]; then
            echo "Android NDK r28+ is required (16 KB page-size support), found '${NDK_MAJOR:-unknown}' in ${NDK_DIR}" >&2
            exit 1
          fi

          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "Using Android NDK ${NDK_VERSION} at ${NDK_DIR}"

      - name: Configure CMake (Android)
        run: |
          # Cross-compilation goes through the NDK toolchain file (NDK clang +
          # sysroot for ${ABI}), and ANDROID_PLATFORM matches the app's minSdk.
          # ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON is the NDK r27+ switch behind
          # -Wl,-z,max-page-size=16384 (already the r28 default; passed
          # explicitly so the 16 KB intent survives toolchain changes and is
          # re-verified post-build).
          # Tools, server and app are OFF for Android: this artifact is the
          # native library consumed by SeasonLLM through P/Invoke, and both UI
          # paths stay disabled exactly like the Linux job (LLAMA_BUILD_UI=OFF
          # plus LLAMA_USE_PREBUILT_UI=OFF so no npm build and no prebuilt UI
          # download can creep in). MTMD is ON because SeasonLLM ships the
          # multimodal (mmproj) path.
          # The backend model differs from Windows/Linux: CPU is the only
          # backend (no CUDA/Vulkan on Android), and GGML_BACKEND_DL=OFF keeps
          # it a plain shared library linked into libggml.so via DT_NEEDED, so
          # the registry self-registers at load time (same runtime model as the
          # iOS build) and the app only loads libllama.so - no backend directory
          # scan or dlopen bookkeeping on the .NET side. The CPU baseline
          # (armv8.2-a+dotprod, M1/Apple-A14 class) matches the iOS build.
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE="${{ github.event.inputs.configuration }}" \
            -DCMAKE_C_FLAGS="-DGGML_MAX_NAME=128" \
            -DCMAKE_CXX_FLAGS="-DGGML_MAX_NAME=128" \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_MTMD=ON \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DGGML_OPENMP=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF

      - name: Build
        run: |
          cmake --build build-android --config "${{ github.event.inputs.configuration }}" --parallel "${{ github.event.inputs.build_parallel }}"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          out="out/runtimes/${RID}/native/multi-backend"
          mkdir -p "$out"

          cp LICENSE "$out/llama.cpp.txt"
          if [ -f ggml/LICENSE ]; then
            cp ggml/LICENSE "$out/ggml.txt"
          fi

          for header in include/llama.h include/llama-cpp.h; do
            if [ -f "$header" ]; then
              cp "$header" "$out"
            fi
          done

          # The NDK toolchain has no versioned SONAMEs (CMake's VERSION/
          # SOVERSION turn into plain lib<name>.so files - exactly the names
          # the Android linker resolves inside the APK), so the -L glob copy
          # only defends against toolchain changes that would reintroduce the
          # Linux-style symlink chain. Tools are OFF, so bin/ holds libraries
          # only and a targeted library copy is more precise than cp -RL bin/.
          find build-android -name 'libllama.so*' -exec cp -Lf {} "$out/" \;
          find build-android -name 'libmtmd.so*' -exec cp -Lf {} "$out/" \;
          find build-android -name 'libggml*.so*' -exec cp -Lf {} "$out/" \;

          for name in libllama.so libmtmd.so libggml.so libggml-base.so libggml-cpu.so; do
            if [ ! -f "$out/$name" ]; then
              echo "Required llama.cpp runtime is missing: $name" >&2
              exit 1
            fi
          done

          {
            echo "Platform: ${RID} (ABI: ${ABI}; deployed under jniLibs/lib/${ABI})"
            echo "Android API level: ${ANDROID_API} (matches the app's minSdk)"
            echo "Configuration: ${{ github.event.inputs.configuration }}"
            echo "LLAMA_REPO: https://github.com/${{ env.LLAMA_REPO }}"
            echo "LLAMA_REF: ${{ github.event.inputs.llama_ref }}"
            echo "GGML_REPO: https://github.com/${{ env.GGML_REPO }}"
            echo "GGML_REF: ${{ github.event.inputs.ggml_ref }}"
            echo "GGML_MAX_NAME: 128"
            echo "Android NDK: ${{ github.event.inputs.android_ndk_version }} (r28+ required)"
            echo "Enabled backends: cpu (single variant, armv8.2-a+dotprod baseline)"
            echo ""
            echo "This build packages llama.cpp for Android arm64-v8a only."
            echo "Only 64-bit real devices are in scope: no armeabi-v7a / x86 / x86_64 slices are produced, so Android emulators are excluded."
            echo "Command line tools (llama-cli, llama-server) are not built for Android: this artifact is the native library consumed by SeasonLLM through P/Invoke."
            echo "libmtmd.so carries the multimodal (mmproj) path used by SeasonLLM."
            echo "This build overrides the default GGML_MAX_NAME=64 and compiles all ggml targets with GGML_MAX_NAME=128 so the ggml_tensor layout matches the other ggml-based runtimes linked into the same app (qwentts, stable-diffusion and SeasonGGML, which all use 128)."
            echo "GGML_BACKEND_DL=OFF: libggml-cpu.so is a plain shared library linked into libggml.so via DT_NEEDED, so the backend registry self-registers at load time (same runtime model as iOS) and nothing has to be scanned or dlopen'd by the app."
            echo "CPU targets the armv8.2-a+dotprod baseline (Cortex-A75 class and newer), the same CPU floor the iOS build uses (M1 baseline)."
            echo "CUDA, Vulkan and OpenMP do not exist on the Android target and are explicitly disabled."
            echo "The NDK links 16 KB page-size aligned libraries by default; every shipped .so is re-checked below (Play requirement)."
            echo ""
            echo "The ggml core libraries (libggml.so, libggml-base.so, libggml-cpu.so) are also produced by the SeasonGGML / stable-diffusion / qwentts Android builds from the same ggml ref; ship exactly ONE copy of them inside the APK and let libllama.so / libstable-diffusion.so / libqwen.so resolve it via DT_NEEDED."
            echo ""
            echo "Artifact contents:"
            (cd "$out" && ls -1 | sort)
          } > "$out/README.txt"

      - name: Verify 16 KB page-size alignment
        run: |
          set -euo pipefail

          out="out/runtimes/${RID}/native/multi-backend"
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          MIN_ALIGN=$((0x4000))

          # Play rejects uploads where any 64-bit .so carries a PT_LOAD segment
          # aligned below 16 KB. The loop runs over the exact files that get
          # uploaded (not the build tree), and the AArch64 check catches a
          # mis-built host/32-bit artifact before it can reach an app.
          report=""
          for so in "$out"/*.so; do
            machine="$("${READELF}" -h "$so" | sed -n 's/^ *Machine: *//p')"
            if [ "${machine}" != "AArch64" ]; then
              echo "$(basename "$so"): expected AArch64, found '${machine}'" >&2
              exit 1
            fi

            min_align=""
            while read -r align; do
              value=$((align))
              if [ -z "${min_align}" ] || [ "${value}" -lt "${min_align}" ]; then
                min_align="${value}"
              fi
            done < <("${READELF}" -lW "$so" | awk '$1 == "LOAD" { print $NF }')

            if [ -z "${min_align}" ] || [ "${min_align}" -lt "${MIN_ALIGN}" ]; then
              echo "$(basename "$so"): smallest PT_LOAD alignment is below 16 KB" >&2
              "${READELF}" -lW "$so" >&2
              exit 1
            fi

            printf '  %-28s min PT_LOAD align = 0x%x\n' "$(basename "$so")" "${min_align}"
            report="${report}$(basename "$so"): min PT_LOAD align = 0x$(printf '%x' "${min_align}")"$'\n'
          done

          {
            echo ""
            echo "16 KB page-size alignment (Play requirement, verified after the build):"
            printf '%s' "${report}"
          } >> "$out/README.txt"

          echo ""
          echo "All .so files are 16 KB page-size aligned."

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-llama-${{ env.RID }}-multi-backend-${{ github.event.inputs.configuration }}
          path: out/runtimes/${{ env.RID }}/native/multi-backend/
          if-no-files-found: error
